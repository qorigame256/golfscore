# main に送られたら、app/ の中身だけを GitHub Pages に公開する
# 動くのは下の paths を触った push だけ（空のコミットでは動かない）。失敗した公開のやり直しは、GitHub の Actions の画面の「Re-run jobs」か、このファイルを触った push
name: Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
